		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) return non-zero

		<!-- Pre-paint theme: data/theme.js only runs after main.js (a module,
		     deferred), so a dark-mode user painted the light :root default first
		     and flashed light before dark applied. Resolve the same stored
		     preference synchronously here, before first paint. Storage key and
		     bg literals mirror data/theme.js / glass.css — keep them in step. -->
		<script>
			try {
				var m = localStorage.getItem("hrms:theme")
				if (["light", "dark", "system"].indexOf(m) === -1) m = "system"
				var dark =
					m === "dark" ||
					(m === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
				var el = document.documentElement
				el.classList.toggle("dark", dark)
				el.setAttribute("data-theme", dark ? "dark" : "light")
				var meta = document.querySelector('meta[name="theme-color"]')
				if (meta) meta.setAttribute("content", dark ? "#000000" : "#F2F2F7")
			} catch (e) {
				/* storage/matchMedia unavailable — fall through to CSS default */
			}
		</script>
		<!-- alpha.12 C3: the launch shell, painted from this file before any
		     script runs (Apple, loading: "Show something as soon as possible").
		     Same grounds, gutter and radius as the app; Vue replaces it on mount. -->
		<style>
			html, body { margin: 0; background: #F2F2F7; }
			.boot-shell { box-sizing: border-box; min-height: 100vh; padding: calc(env(safe-area-inset-top, 0px) + 60px) 16px 0; }
			.boot-shell__title { width: 132px; height: 34px; margin: 0 0 24px; border-radius: 8px; background: #E3E3E8; }
			.boot-shell__group { max-width: 672px; margin: 0 0 24px; padding: 16px; border-radius: 26px; background: #FFFFFF; }
			.boot-shell__row { height: 12px; margin: 16px 0; border-radius: 6px; background: #ECEDEF; animation: boot-pulse 1.4s ease-in-out infinite; }
			.boot-shell__row:first-child { width: 40%; margin-top: 4px; }
			.boot-shell__row:last-child { width: 70%; margin-bottom: 4px; }
			@keyframes boot-pulse { 50% { opacity: 0.5; } }
			@media (prefers-color-scheme: dark) {
				html, body { background: #000000; }
				.boot-shell__title { background: #2C2C2E; }
				.boot-shell__group { background: #1C1C1E; }
				.boot-shell__row { background: #313133; }
			}
			@media (prefers-reduced-motion: reduce) { .boot-shell__row { animation: none; } }
			@media (min-width: 1024px) { .boot-shell { padding-left: 232px; } }
		</style>

	<body class="antialiased">
		<div id="app">
			<div class="boot-shell" aria-hidden="true">
				<div class="boot-shell__title"></div>
				<div class="boot-shell__group"><div class="boot-shell__row"></div><div class="boot-shell__row"></div><div class="boot-shell__row"></div></div>
				<div class="boot-shell__group"><div class="boot-shell__row"></div><div class="boot-shell__row"></div><div class="boot-shell__row"></div></div>
			</div>
		</div>
		<div id="modals"></div>

			window.site_name = '{{ site_name }}'
			if (!window.frappe) window.frappe = {}
