[project]
name = "hrms"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io" },
]
description = "Open Source HR & Payroll Software"
# Mirrors the hard floor of the required frappe v16 (">=3.14,<3.15"): hrms
# cannot install on anything older, because frappe itself will not. CI runs
# 3.14 (.github/workflows/ci.yml); patch.yml additionally provisions 3.11/3.13
# only to walk an old backup up through the v14 -> v15 -> v16 chain.
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.frappe.testing.function_type_validation]
max_module_depth = 0

[tool.ruff]
line-length = 110
# Deliberately BELOW requires-python. target-version only chooses which
# modernisations ruff suggests, and it is the conservative direction: raising it
# to py314 asks ruff to unquote TYPE_CHECKING-only annotations (UP037) whose
# runtime safety then rests on PEP 649 deferred evaluation and on how frappe's
# typing_validations resolves them. That is a separate, reviewable change — not
# something to bundle with a migration.
target-version = "py310"
force-exclude = true
extend-exclude = [
    "frontend",
    "frappe-ui",
    "roster",
    "**/node_modules",
    "**/dist",
    "**/*.lock",
    "**/yarn.lock",
    "**/package-lock.json",
]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017",   # assertRaises(Exception) - should be more specific
    "B018",   # useless expression, not assigned to anything
    "B023",   # function doesn't bind loop variable - will have last iteration's value
    "B904",   # raise inside except without from
    "E101",   # indentation contains mixed spaces and tabs
    "E402",   # module level import not at top of file
    "E501",   # line too long
    "E741",   # ambiguous variable name
    "F401",   # "unused" imports
    "F403",   # can't detect undefined names from * import
    "F405",   # can't detect undefined names from * import
    "F722",   # syntax error in forward type annotation
    "W191",   # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ruff.lint.isort.sections]
"frappe" = ["frappe"]
"erpnext" = ["erpnext"]
"hrms" = ["hrms"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "frappe",
    "erpnext",
    "hrms",
    "first-party",
    "local-folder",
]


[project.urls]
Homepage = "https://frappe.io/hr"
Repository = "https://github.com/frappe/hrms.git"
Documentation = "https://docs.frappe.io/hr"
"Bug Reports" = "https://github.com/frappe/hrms/issues"


[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
