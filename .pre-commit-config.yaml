exclude: 'node_modules|.git'
default_stages: [pre-commit]
fail_fast: false


repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.0.1
    hooks:
      - id: trailing-whitespace
        files: "hrms.*"
        exclude: ".*json$|.*txt$|.*csv|.*md"
      - id: check-yaml
      - id: no-commit-to-branch
        args: ['--branch', 'develop']
      - id: check-merge-conflict
      - id: check-ast

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, ts, vue, css, scss]
        # Ignore frontend folder and any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                frontend/.*|
                hrms/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                hrms/templates/includes/.*|
                hrms/hr/doctype/employee_promotion/employee_promotion.js|
                hrms/hr/doctype/employee_transfer/employee_transfer.js|
            )$

  - repo: local
    hooks:
      # frontend/ stays excluded from mirrors-prettier above ON PURPOSE. That
      # hook is prettier v3; the frontend runs prettier 2.8.8 through
      # eslint-plugin-prettier with its own .prettierrc.json, and v3 changed
      # enough defaults that the two would reformat each other forever. This
      # runs the frontend's OWN eslint, so the hook and `yarn lint` cannot
      # disagree by construction.
      - id: frontend-eslint
        name: "ESLint (frontend)"
        entry: frontend/node_modules/.bin/eslint --resolve-plugins-relative-to frontend --no-eslintrc -c frontend/.eslintrc.cjs --max-warnings=0 --fix
        language: system
        files: '^frontend/src/.*\.(vue|js)$'
        pass_filenames: true

      - id: fixture-timestamps
        name: "Synced fixtures must advance `modified`"
        description: >
          Frappe skips a standard-doc import when the row in the database is not
          older than the file, so a fixture edit without a timestamp bump is a
          silent no-op on every existing site. See the script's docstring for the
          three outages this caught after the fact.
        entry: python3 scripts/check_fixture_timestamps.py
        language: system
        files: '\.json$'
        pass_filenames: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.7
    hooks:
      - id: ruff
        name: "Run ruff linter and apply fixes"
        args: ["--fix"]

      - id: ruff-format
        name: "Format Python code"

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
