<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nadi · Compact experience proposal</title>
<style>
@font-face{font-family:InterTight;src:url('../../../frontend/node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2')}*{box-sizing:border-box}body{margin:0;background:#edeff3;color:#0b0c10;font:15px/1.45 InterTight,system-ui,sans-serif;--paper:#fff;--line:#d5d9df;--muted:#505967;--tint:#f4f6f8;--accent:#3f5c00;--lime:#c8ff00}body.dark{background:#07070a;color:#fff;--paper:#17191e;--line:#353941;--muted:#b2bac7;--tint:#22252d;--accent:#c8ff00}button,input,select,textarea{font:inherit}button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}button{border:1px solid var(--line);border-radius:10px;min-height:44px;background:var(--paper);padding:8px 13px;font-weight:600}button:hover{background:var(--tint)}button.primary{background:var(--lime);color:#132000;border-color:transparent}button.quiet{background:transparent;border-color:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}a{color:var(--accent)}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.6px}h2{font-size:17px;letter-spacing:-.2px}h3{font-size:15px}small,.muted{color:var(--muted)}small{font-size:13px}.review{padding:18px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--paper)}.review p{font-size:13px;color:var(--muted)}.review strong{font-size:16px}.review-tools{display:flex;gap:8px;align-items:center}.review select{width:160px}.shell{display:grid;grid-template-columns:200px minmax(0,1fr);max-width:1180px;margin:24px auto;padding:0 20px;gap:24px}.side{padding:14px 0}.brand{font-size:28px;letter-spacing:-1.5px;font-weight:850}.side .brand{margin:0 12px 20px}.side button{display:flex;width:100%;text-align:left;gap:12px;align-items:center;margin-bottom:4px;border-color:transparent;background:transparent}.side button[aria-current=page]{background:var(--paper);color:var(--accent)}.side small{display:block;margin:20px 14px 8px}.app{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}.apphead{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;border-bottom:1px solid var(--line);height:66px}.apphead .brand{font-size:24px}.headtools{display:flex;gap:4px}.avatar{width:44px;padding:0;background:var(--tint)}.content{max-width:780px;margin:auto;padding:20px;display:grid;gap:16px;min-height:620px;align-content:start}.topline,.spread{display:flex;align-items:center;justify-content:space-between;gap:12px}.topline{min-height:44px}.stack{display:grid;gap:12px}.panel{border:1px solid var(--line);border-radius:12px;overflow:hidden}.panel-head{padding:12px 14px;background:var(--tint)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;min-height:56px}.row+.row{border-top:1px solid var(--line)}button.row{width:100%;border:0;border-radius:0;text-align:left;background:transparent;font-weight:400}.row div{min-width:0}.row strong,.row small{display:block}.row svg{flex-shrink:0}.metric{font-size:26px;font-weight:750;letter-spacing:-.5px}.badge{display:inline-block;padding:3px 8px;border-radius:5px;background:var(--tint);font-size:12px;font-weight:650;white-space:nowrap}.badge.open{color:var(--accent)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary .panel{padding:14px}.summary strong{font-size:25px;display:block}.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.segments{display:flex;gap:4px;background:var(--tint);padding:4px;border-radius:12px}.segments button{flex:1;background:transparent;border-color:transparent;min-width:0;padding:6px;font-size:14px}.segments button[aria-pressed=true]{background:var(--paper);border-color:var(--line)}.today{background:var(--tint);border-radius:12px;padding:14px}.today button{flex-shrink:0}.sectiontitle{display:flex;justify-content:space-between;align-items:center;min-height:44px}.sectiontitle button{color:var(--accent);font-size:14px;padding:6px 8px}.nav{display:none}.ico{width:19px;height:19px;stroke-width:1.7;vertical-align:middle}.form{display:grid;gap:14px}.form label{font-weight:600;display:grid;gap:6px}.form label small{font-weight:400}input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--paper);color:inherit}textarea{min-height:90px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footnote{font-size:13px;color:var(--muted)}.notice{padding:12px 14px;border-left:3px solid var(--accent);background:var(--tint);border-radius:4px}.feedback:empty{display:none}.feedback{background:var(--tint);padding:12px;border-radius:10px}.prose{line-height:1.65;font-size:16px}.prose p+p{margin-top:16px}.nav svg{display:block;margin:auto auto 3px}.back{padding:6px;min-width:44px}details summary{cursor:pointer;min-height:44px;padding:10px 0;color:var(--muted)}.desktopnote{max-width:1180px;margin:16px auto;padding:0 20px;color:var(--muted);font-size:13px}
@media(min-width:1000px){.home-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}.home-panels>.stack:last-child{grid-column:1/-1}}
@media(max-width:760px){.review{padding:10px 16px;display:block}.review-tools{margin-top:8px}.review p{font-size:12px}.review select{flex:1}.review strong{font-size:14px}.shell{display:block;margin:0;padding:0}.side{display:none}.app{border:0;border-radius:0;min-height:calc(100dvh - 118px)}.apphead{height:56px;padding:6px 16px}.content{padding:12px 16px 88px;gap:12px;min-height:0}.nav{position:fixed;z-index:3;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);padding:5px 8px calc(5px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}.nav button{border:0;background:transparent;border-radius:8px;font-size:11px;min-width:0;min-height:54px;padding:5px 0;color:var(--muted)}.nav button[aria-current=page]{color:var(--accent);background:var(--tint)}.row{padding:10px 12px}.home-panels{display:grid;gap:12px}.desktopnote{display:none}h1{font-size:21px}.today{padding:12px}.metric{font-size:23px}.two{gap:8px}.review-tools button{font-size:13px}.summary .panel{padding:12px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body>
<header class="review"><div><strong>Nadi / compact experience</strong><p>Design proposal · sample data · no real requests are sent</p></div><div class="review-tools"><label for="screen" class="muted">Preview</label><select id="screen" aria-label="Preview screen"></select><button id="theme">Dark theme</button></div></header>
<div class="shell"><aside class="side" aria-label="Desktop navigation"><div class="brand">Nadi</div><div id="side-items"></div><small>WORKSPACE</small><button data-go="team">Team & approvals</button><button data-go="profile">Profile & settings</button></aside><div class="app"><header class="apphead"><span class="brand">Nadi</span><div class="headtools"><button class="quiet" data-go="notifications" aria-label="Notifications"><i data-feather="bell"></i></button><button class="avatar" data-go="profile" aria-label="Profile">N</button></div></header><main class="content" id="main"></main><nav class="nav" id="bottom" aria-label="Main navigation"></nav></div></div>
<p class="desktopnote">Review the screens using the preview selector. On a phone, Home sits in the middle. The prototype demonstrates layout and shared entry points; data and workflows are illustrative.</p>
<script src="../../../frontend/node_modules/feather-icons/dist/feather.min.js"></script><script>
const pages={home:'Home',attendance:'Attendance',leave:'Leave',expenses:'Expenses',assets:'Assets',helpdesk:'Helpdesk',issue:'New issue',request:'Request asset',kpi:'My KPI',sop:'SOPs',article:'SOP detail',asset:'Asset detail',ticket:'Issue detail',history:'My requests',team:'Team & approvals',profile:'Profile',notifications:'Notifications'};
const icons={home:'home',attendance:'clock',leave:'calendar',expenses:'credit-card',assets:'package',helpdesk:'life-buoy',kpi:'bar-chart-2',sop:'book-open'};
const nav=['attendance','leave','home','expenses','assets'];let current='home',assetTab='mine',helpTab='all';
const icon=n=>`<i data-feather="${n}"></i>`;
const go=(key,label,cls='quiet')=>`<button class="${cls}" data-go="${key}" ${cls.includes('back')?'aria-label="Back"':''}>${label}</button>`;
const badge=(text,open=false)=>`<span class="badge ${open?'open':''}">${text}</span>`;
const row=(title,sub,key,end='')=>`<button class="row" data-go="${key}"><div><strong>${title}</strong><small>${sub}</small></div>${end||icon('chevron-right')}</button>`;
const title=(text,action='')=>`<div class="topline"><h1>${text}</h1>${action}</div>`;
const heading=(text,key)=>`<div class="sectiontitle"><h2>${text}</h2>${key?go(key,'See all'):''}</div>`;
const back=(key,text)=>title(`<span class="inline">${go(key,icon('arrow-left'),'quiet back')} ${text}</span>`);
const formFooter=label=>`<button class="primary" type="submit">${label}</button><p class="footnote">Preview only. Nothing is sent or saved.</p><p class="feedback" role="status"></p>`;
function home(){return title('Your day', '<small>Mon, 7 Sep</small>')+`<div class="today spread"><div><strong>Checked in at 09:02</strong><p class="muted">Today · 09:00–18:00</p></div><button class="primary" data-demo="Check-out confirmation opens here in the app.">Check out</button></div><p class="feedback" role="status" id="feedback"></p><div class="home-panels"><div class="stack">${heading('At a glance')}<div class="panel">${row('My KPI','2026 · average of 2 cycles','kpi','<span class="metric">82<small>/ 100</small></span>')}${row('Helpdesk','1 open · 1 in progress','helpdesk',badge('2 active',true))}</div></div><div class="stack">${heading('SOPs','sop')}<div class="panel">${row('Attendance & timekeeping','Pinned · General','article')}${row('IT equipment care','Pinned · General','article')}</div></div><div class="stack">${heading('My requests','history')}<div class="panel">${row('Annual leave · 14–15 Sep','2 days','history',badge('Pending'))}${row('Travel expense','RM 84.00','history',badge('Approved',true))}</div></div></div>`}
function helpdesk(){const rows=[['Laptop cannot connect to Wi-Fi','IT · Network · Today','Open','it'],['Leave balance looks incorrect','HR · Leave balance · 5 Sep','In Progress','hr']];return title('Helpdesk',go('issue','New issue','primary'))+`<input id="search" aria-label="Search issues" placeholder="Search title or issue number"><div class="segments" aria-label="Filter issues">${['all','hr','it'].map(x=>`<button data-help="${x}" aria-pressed="${helpTab===x}">${x==='all'?'All issues':x.toUpperCase()}</button>`).join('')}</div><div class="panel" id="issue-results">${rows.filter(x=>helpTab==='all'||x[3]===helpTab).map(x=>row(x[0],x[1],'ticket',badge(x[2],true))).join('')}</div><p id="no-results" hidden>No matching issues.</p><p class="footnote">One place for your IT and HR issues.</p>`}
function issue(){return back('helpdesk','New issue')+`<form class="form" data-form="issue"><div class="two"><label>Team<select id="issue-team"><option>HR</option><option>IT</option></select></label><label>Type<select id="issue-type" required></select></label></div><label>Title<input name="title" required maxlength="140" placeholder="A short summary of the problem"></label><label>Details<textarea required placeholder="What happened, and what did you expect?"></textarea></label><div id="conditional"></div><details><summary>Attachment & urgency (optional)</summary><div class="stack"><label>Attachment<input type="file"></label><label>Urgency<select><option>Low</option><option selected>Medium</option><option>High</option></select></label></div></details>${formFooter('Send issue')}</form>`}
function assets(){return title('Assets',go('request','Request asset','primary'))+`<div class="segments"><button data-assets="mine" aria-pressed="${assetTab==='mine'}">My assets · 2</button><button data-assets="requests" aria-pressed="${assetTab==='requests'}">Requests · 1</button></div><div class="panel">${assetTab==='mine'?row('Work laptop','AST-0042 · Assigned to you','asset',icon('monitor'))+row('Wireless keyboard','AST-0108 · Assigned to you','asset',icon('package')):row('External monitor','Requested 4 Sep · 1 unit','history',badge('Pending'))}</div><p class="footnote">${assetTab==='mine'?'Equipment assigned to you. Open an item to view its details.':'Track approval and fulfilment here.'}</p>`}
function request(){return back('assets','Request asset')+`<form class="form" data-form="asset"><label>Asset category<select required><option value="">Select a category</option><option>Laptop</option><option>Monitor</option><option>Keyboard</option><option>Other equipment</option></select></label><div class="two"><label>Quantity<input type="number" min="1" max="20" value="1" required></label><label>Needed by<input type="date" required></label></div><label>Reason<textarea required placeholder="Tell us what you need it for"></textarea></label><details><summary>Add an attachment (optional)</summary><label>Attachment<input type="file"></label></details>${formFooter('Send request')}</form>`}
function attendance(){return title('Attendance')+`<div class="today spread"><div><strong>Today · Mon, 7 Sep</strong><p class="muted">Checked in 09:02 · Shift ends 18:00</p></div>${badge('Present',true)}</div><div class="panel">${row('Attendance correction','Missing or incorrect attendance','history')}${row('Claim overtime or leave','One claim, based on your entitlement','history')}${row('Request a shift','Change your assigned shift','history')}</div>${heading('This week')}<div class="panel">${row('Mon–Fri · Day shift','09:00–18:00','history')}</div><details><summary>Month calendar</summary><p class="muted">The existing interactive attendance calendar appears here.</p></details>${heading('Recent requests')}<div class="panel">${row('Attendance correction · 4 Sep','Check-out time','history',badge('Pending'))}</div>`}
function leave(){return title('Leave', '<button class="primary" data-demo="The existing leave form opens here, with balances and date validation.">Apply for leave</button>')+`<div class="summary"><div class="panel"><small>Annual leave available</small><strong>8 days</strong></div><div class="panel"><small>Replacement leave</small><strong>1 day</strong></div></div>${heading('My applications','history')}<div class="panel">${row('Annual leave · 14–15 Sep','2 days','history',badge('Pending'))}</div>${heading('Upcoming holiday')}<div class="panel"><div class="row"><div><strong>Malaysia Day</strong><small>16 Sep · Sample calendar</small></div>${icon('calendar')}</div></div><p class="feedback" id="feedback" role="status"></p>`}
function expenses(){return title('Expenses','<button class="primary" data-demo="The existing expense form opens here, with receipt upload.">Claim expense</button>')+`<div class="summary"><div class="panel"><small>Pending approval</small><strong>RM 120</strong></div><div class="panel"><small>Approved</small><strong>RM 84</strong></div></div>${heading('Recent claims','history')}<div class="panel">${row('Office supplies','5 Sep · RM 120','history',badge('Pending'))}${row('Travel expense','3 Sep · RM 84','history',badge('Approved',true))}</div><p class="feedback" id="feedback" role="status"></p>`}
function kpi(){return back('home','My KPI')+`<div class="two"><label>Year<select><option>2026</option></select></label><label>Period<select><option>All cycles · Average</option></select></label></div><div class="today spread"><div><small>2026 · average of 2 cycles</small><p class="metric">82 / 100</p></div>${badge('Year average',true)}</div>${heading('Key result areas')}<div class="panel"><div class="row"><div><strong>Delivery</strong><small>Actual 18 · Target 20</small></div><strong>90%</strong></div><div class="row"><div><strong>Quality</strong><small>Manager rating · 4 / 5</small></div><strong>80%</strong></div></div><details><summary>Score trend</summary><p>Cycle 1: 80 / 100 · Cycle 2: 84 / 100</p></details><p class="footnote">Only your own scores are shown.</p>`}
function sop(){return back('home','SOPs')+`<input id="sop-search" aria-label="Search SOPs" placeholder="Search SOPs"><div class="panel" id="sop-results">${row('Attendance & timekeeping','Pinned · General','article')}${row('IT equipment care','Pinned · General','article')}${row('Expense claim guide','General','article')}</div><p id="sop-empty" hidden>No matching SOPs.</p>`}
function simple(){if(current==='article')return back('sop','SOP detail')+`<h2>Attendance & timekeeping</h2><small>General · Example content</small><div class="prose"><p>Check in when your shift begins. Check out when your work is finished.</p><p>If a punch is missing, open Attendance and request a correction. Your request will appear in My requests.</p><p>For a technical problem, use New issue in Helpdesk. Describe what happened and include the affected date.</p></div>`;if(current==='asset')return back('assets','Asset detail')+`<h2>Work laptop</h2><div class="panel"><div class="row"><span>Asset number</span><strong>AST-0042</strong></div><div class="row"><span>Assignment</span>${badge('Assigned to you',true)}</div></div><button class="primary" id="asset-problem">Report a problem</button>`;if(current==='ticket')return back('helpdesk','Issue detail')+`<h2>Laptop cannot connect to Wi-Fi</h2><div class="inline">${badge('IT')}${badge('Network')}${badge('Open',true)}</div><div class="panel"><div class="row"><div><strong>Details</strong><p>Wi-Fi disconnects after the laptop wakes up.</p></div></div><div class="row"><span>Created</span><span>7 Sep · 10:30</span></div></div><p class="footnote">Your issue has been received. Status updates appear here.</p>`;if(current==='history')return back('home','My requests')+`<p class="muted">Layout preview of the combined request history.</p><div class="panel">${row('Annual leave · 14–15 Sep','2 days','leave',badge('Pending'))}${row('External monitor','1 unit','assets',badge('Pending'))}${row('Travel expense','RM 84','expenses',badge('Approved',true))}</div>`;if(current==='team')return back('home','Team & approvals')+`<p class="notice">Manager view example. Visibility follows your existing access.</p><div class="panel">${row('Requests to review','2 pending requests','history')}${row('Remote check-in approvals','1 pending request','history')}${row('Team roster','View schedules','attendance')}</div>`;if(current==='notifications')return back('home','Notifications')+`<div class="panel">${row('Your expense was approved','Travel expense · Today','expenses')}${row('Issue status updated','IT issue · In Progress','helpdesk')}</div>`;return back('home','Profile')+`<div><h2>Your profile</h2><p class="muted">Employee self-service</p></div><div class="panel">${row('Team & approvals','Shown only when you have access','team')}${row('HR contacts','Your HR support team','helpdesk')}<button class="row" data-demo="Existing theme, notification and account settings remain available."><strong>Settings</strong>${icon('chevron-right')}</button></div><p class="feedback" id="feedback" role="status"></p>`}
function types(){console.info('[Nadi prototype] Updating sample issue types');const team=document.getElementById('issue-team').value;document.getElementById('issue-type').innerHTML=(team==='HR'?['Other HR Issue','Leave Balance Discrepancy','Check-in / Check-out Problem']:['Device','Software','Access','Network','Other IT issue']).map(x=>`<option>${x}</option>`).join('');conditional()}
function conditional(){const type=document.getElementById('issue-type').value;document.getElementById('conditional').innerHTML=type==='Leave Balance Discrepancy'?'<div class="two"><label>Balance shown<input type="number" min="0"></label><label>Balance expected<input type="number" min="0"></label></div>':type==='Check-in / Check-out Problem'?'<label>Affected date<input type="date"></label>':''}
function render(key){console.info('[Nadi prototype] Showing screen',key);current=pages[key]?key:'home';document.getElementById('screen').value=current;const views={home,attendance,leave,expenses,assets,helpdesk,issue,request,kpi,sop};document.getElementById('main').innerHTML=(views[current]||simple)();const active=['issue','ticket','helpdesk','kpi','sop','article','history','team','profile','notifications'].includes(current)?'home':['asset','request'].includes(current)?'assets':current;document.getElementById('bottom').innerHTML=nav.map(key=>`<button data-go="${key}" ${key===active?'aria-current="page"':''}>${icon(icons[key])}${pages[key]}</button>`).join('');document.getElementById('side-items').innerHTML=['home','attendance','leave','expenses','assets','helpdesk','kpi','sop'].map(key=>`<button data-go="${key}" ${key===current?'aria-current="page"':''}>${icon(icons[key])}${pages[key]}</button>`).join('');if(current==='issue')types();feather.replace({class:'ico'});window.scrollTo(0,0)}
document.getElementById('screen').innerHTML=Object.entries(pages).map(([key,label])=>`<option value="${key}">${label}</option>`).join('');document.getElementById('screen').onchange=e=>render(e.target.value);document.getElementById('theme').onclick=e=>{document.body.classList.toggle('dark');e.target.textContent=document.body.classList.contains('dark')?'Light theme':'Dark theme'};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){render(b.dataset.go);document.querySelector('#main h1')?.setAttribute('tabindex','-1');document.querySelector('#main h1')?.focus({preventScroll:true})}if(b.dataset.assets){assetTab=b.dataset.assets;render('assets')}if(b.dataset.help){helpTab=b.dataset.help;render('helpdesk')}if(b.dataset.demo){const f=document.getElementById('feedback');if(f)f.textContent=b.dataset.demo}if(b.id==='asset-problem'){render('issue');document.getElementById('issue-team').value='IT';types();document.querySelector('[name=title]').value='Problem with work laptop (AST-0042)'}});
document.addEventListener('change',e=>{if(e.target.id==='issue-team')types();if(e.target.id==='issue-type')conditional()});
document.addEventListener('input',e=>{const isIssue=e.target.id==='search',isSop=e.target.id==='sop-search';if(!isIssue&&!isSop)return;const rows=document.querySelectorAll(isIssue?'#issue-results .row':'#sop-results .row');let found=0;rows.forEach(row=>{const match=row.textContent.toLowerCase().includes(e.target.value.toLowerCase());row.style.display=match?'':'none';if(match)found++});document.getElementById(isIssue?'no-results':'sop-empty').hidden=found>0});
document.addEventListener('submit',e=>{e.preventDefault();console.info('[Nadi prototype] Demonstration form validated');e.target.querySelector('.feedback').textContent='Preview complete. The form is valid; no real record was created.'});render('home');
</script></body></html>
