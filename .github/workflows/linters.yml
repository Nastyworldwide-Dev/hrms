name: Linters

on:
  pull_request: { }

jobs:
  commit-lint:
    name: 'Semantic Commits'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 200
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: Check commit titles
        run: |
          npm install @commitlint/cli @commitlint/config-conventional
          npx commitlint --verbose --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install and Run Pre-commit
        uses: pre-commit/action@v3.0.0

      # Belt and braces on top of the pre-commit hook: pre-commit sees one
      # commit's staged files, this sees the whole PR. A fixture edited in an
      # early commit and rebased forward would slip past the former.
      - name: Synced fixtures must advance `modified`
        run: python3 scripts/check_fixture_timestamps.py --since ${{ github.event.pull_request.base.sha }}

      - name: Fixture guard's own tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  frontend:
    name: 'Frontend lint & unit tests'
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - run: yarn install --frozen-lockfile

      # Neither of these ran anywhere until now. `yarn lint` was red on HEAD
      # with 599 errors and pre-commit excludes frontend/ from prettier, so the
      # app's only linter was absent from both gates it could have run in.
      - name: ESLint
        run: yarn lint

      - name: Unit tests
        run: yarn test

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Download semgrep
        run: pip install semgrep

      - name: Run Semgrep rules
        run: semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

      - name: Semgrep for Test Correctness
        run: semgrep ci --include=**/test_*.py --config ./semgrep/test-correctness.yml        
